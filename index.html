<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Memory Match</title>
  <meta name="description" content="A classic pairs memory game. Works offline, on any screen.">
  <meta name="theme-color" content="#101828">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-64.png" sizes="64x64">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Memory">
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <h1 id="title">Memory</h1>
      <div id="stats" aria-live="polite">
        <span id="moves">0 moves</span>
        <span class="sep" aria-hidden="true">&middot;</span>
        <span id="timer">0:00</span>
        <button id="mute" aria-label="Toggle sound" aria-pressed="false">&#128266;</button>
      </div>
    </header>

    <main id="board" role="grid" aria-label="Memory board" data-grid="4x4"></main>

    <footer id="controls">
      <div id="sizes" role="radiogroup" aria-label="Board size">
        <button class="size" data-grid="4x4" aria-checked="true">4&times;4</button>
        <button class="size" data-grid="6x6" aria-checked="false">6&times;6</button>
        <button class="size" data-grid="4x5" aria-checked="false">4&times;5</button>
      </div>
      <button id="restart" aria-label="Restart game with a new board">New game</button>
    </footer>

    <dialog id="win-dialog">
      <h2>Solved!</h2>
      <p id="win-stats">—</p>
      <p id="win-best">—</p>
      <form method="dialog">
        <button autofocus>Play again</button>
      </form>
    </dialog>

    <button id="install" hidden>Install app</button>
  </div>

  <script src="game.js" type="module"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () =>
        navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }));
    }
  </script>
</body>
</html>
